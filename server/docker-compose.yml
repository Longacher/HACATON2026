services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: otklik
      POSTGRES_PASSWORD: otklik
      POSTGRES_DB: otklik
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otklik"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://otklik:otklik@db:5432/otklik
      JWT_SECRET: change-me-in-prod
      SEED_DEMO: "1"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
